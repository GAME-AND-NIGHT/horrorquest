<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR сканер | Resident Evil</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/style.css">
  <style>
    body {
      background: #000;
      color: white;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-base);
    }
  </style>
</head>
<body>
<div class="scanner-container">
  <video id="video" autoplay playsinline muted></video>
  <div class="scanner-header">
    <div class="scanner-title">RESIDENT EVIL // СИСТЕМА НАВЕДЕНИЯ</div>
    <div class="scanner-subtitle">СЛЕДУЙТЕ ПО СЛЕДАМ И НАЙДИТЕ QR-КОД СТАНЦИИ</div>
  </div>
  <div class="scan-frame">
    <div class="scan-laser"></div>
  </div>
  <img class="image" src="QRborder.svg" alt="Scan Frame"/>
  <div class="hint">НАВЕДИТЕ КАМЕРУ НА QR-КОД</div>
</div>

<canvas id="qr-canvas"></canvas>

<div id="orientation-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; color: white; display: flex; align-items: center; justify-content: center; z-index: 999999999;">
  <p style="text-align: center; font-size: 1.5rem;">Пожалуйста, поверните экран</p>
</div>

<div id="camera-access-required"
     style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; color: white; text-align: center; z-index: 99999999;">
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%;">
    <h1 style="font-size: 24px; color: #ff3344; margin-bottom: 12px; font-family: var(--font-display);">ТРЕБУЕТСЯ ДОСТУП К КАМЕРЕ</h1>
    <p style="font-size: 16px; opacity: 0.85;">Пожалуйста, разрешите доступ к камере в настройках браузера и обновите страницу.</p>
  </div>
</div>

<script type="module" src="./src/js/scanner.js"></script>
</body>
</html>
