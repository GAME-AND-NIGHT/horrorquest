<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - MindAR & A-Frame</title>

    <!-- 1. Библиотека A-Frame (3D движок) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- 2. Библиотека Mind-AR для A-Frame (Image Tracking) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- 3. Библиотека A-Frame Extras (необходима для работы компонента 'animation-mixer') -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent !important;
        }

        /* Убеждаемся, что a-scene и холст прозрачны для отображения камеры */
        a-scene {
            background-color: transparent !important;
        }

        .a-canvas {
            background-color: transparent !important;
        }

        /* Полноэкранный стартовый оверлей */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            color: #ffffff;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #ui-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 32px 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 15px;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        /* Кнопка запуска */
        .btn-start {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Информационный бейдж внизу экрана во время работы AR */
        #status-badge {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Информационный бейдж статуса трекинга и загрузки модели -->
    <div id="status-badge">Камера активна. Наведите на маркер</div>

    <!-- Стартовый интерфейс (UI-overlay) -->
    <div id="ui-overlay">
        <div class="overlay-card">
            <h1 class="title">Дополненная реальность</h1>
            <p class="description">
                Для работы требуется доступ к камере устройства.<br>
                После запуска наведите камеру на изображение-маркер.
            </p>
            <button id="start-btn" class="btn-start">Старт AR</button>
        </div>
    </div>

    <!-- 
      =======================================================================
      ПУТЬ К ФАЙЛУ МАРКЕРА:
      В параметре 'imageTargetSrc: targets.mind' укажите путь к вашему .mind файлу.
      Параметр 'autoStart: false' предотвращает автоматический запуск камеры.
      ======================================================================= 
    -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Освещение сцены (необходимо для корректного отображения материалов glTF) -->
        <a-light type="ambient" intensity="1.4"></a-light>
        <a-light type="directional" position="1 3 2" intensity="1.5"></a-light>

        <!-- Камера сцены -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 
          Элемент отслеживания маркера:
          targetIndex: 0 соответствует первому изображению внутри файла targets.mind
        -->
        <a-entity mindar-image-target="targetIndex: 0" id="marker-target">
            <!-- Визуальная полупрозрачная рамка: появляется мгновенно, подтверждая захват маркера -->
            <a-plane position="0 0 0" height="0.8" width="0.8" rotation="0 0 0" material="color: #10b981; opacity: 0.35; transparent: true"></a-plane>

            <!-- 
              Контейнер модели:
              Модель Cate2.glb имеет огромный исходный размер (11.7 x 4.5 x 16.6 единиц).
              Масштаб 0.05 подгоняет её под реальный размер маркера (~0.8 единиц).
              Смещение (3.2, 0, -4.3) центрирует модель по осям X и Z точно над маркером.
            -->
            <a-entity position="0 0 0" scale="0.05 0.05 0.05" rotation="0 0 0">
                <a-gltf-model 
                    id="cat-model"
                    src="Cate2.glb" 
                    position="3.2 0 -4.3" 
                    animation-mixer="clip: Rig_Cat|Scene; loop: repeat">
                </a-gltf-model>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const overlay = document.getElementById('ui-overlay');
            const sceneEl = document.getElementById('ar-scene');
            const badge = document.getElementById('status-badge');
            const catModel = document.getElementById('cat-model');
            const markerTarget = document.getElementById('marker-target');

            let isModelLoaded = false;

            // Обработка статуса загрузки 3D модели
            if (catModel) {
                catModel.addEventListener('model-loaded', () => {
                    isModelLoaded = true;
                    console.log('3D-модель Cate2.glb успешно загружена и добавлена на сцену!');
                    if (badge) {
                        badge.textContent = '3D модель готова! Наведите на маркер';
                    }
                });

                catModel.addEventListener('model-error', (err) => {
                    console.error('Ошибка загрузки 3D-модели:', err);
                    if (badge) {
                        badge.textContent = 'Ошибка загрузки 3D модели';
                        badge.style.background = 'rgba(239, 68, 68, 0.85)';
                    }
                });
            }

            // Слушатели распознавания маркера
            if (markerTarget) {
                markerTarget.addEventListener('targetFound', () => {
                    console.log('Маркер найден!');
                    if (badge) {
                        badge.textContent = isModelLoaded ? 'Маркер распознан ✨' : 'Маркер найден, ждем модель (20 МБ)...';
                        badge.style.color = '#34d399';
                    }
                });

                markerTarget.addEventListener('targetLost', () => {
                    console.log('Маркер потерян.');
                    if (badge) {
                        badge.textContent = 'Поиск маркера в кадре...';
                        badge.style.color = '#ffffff';
                    }
                });
            }

            // Проверка открытия файла через file:///
            if (window.location.protocol === 'file:') {
                const desc = document.querySelector('.description');
                if (desc) {
                    desc.innerHTML = '<span style="color: #ef4444; font-weight: bold; font-size: 16px;">⚠️ Файл открыт через file:///</span><br><br>' +
                        'Браузеры блокируют доступ к камере без локального сервера.<br><br>' +
                        'Запустите сервер командой в терминале:<br>' +
                        '<code style="background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px; display: inline-block; margin: 8px 0;">python -m http.server 8000</code><br>' +
                        'и откройте: <a href="http://localhost:8000/test.html" style="color: #60a5fa; text-decoration: underline;">http://localhost:8000/test.html</a>';
                }
            }

            // Слушатели событий MindAR
            sceneEl.addEventListener('arReady', () => {
                console.log('MindAR успешно инициализирован.');
                if (badge) {
                    badge.style.display = 'block';
                    badge.textContent = 'Камера активна. Загрузка модели (20 МБ)...';
                }
            });

            sceneEl.addEventListener('arError', (event) => {
                console.error('Ошибка MindAR:', event);
                alert('Ошибка MindAR: ' + (event.detail?.error || 'Проверьте консоль браузера'));
            });

            startBtn.addEventListener('click', async () => {
                if (window.location.protocol === 'file:') {
                    alert('Браузер не даст доступ к камере по протоколу file:///.\n\nЗапустите локальный сервер (например, python -m http.server 8000) и перейдите на http://localhost:8000/test.html');
                    return;
                }

                startBtn.disabled = true;
                startBtn.textContent = 'Подключение камеры...';

                // Функция запуска MindAR системы
                const runAR = async () => {
                    const arSystem = sceneEl.systems && sceneEl.systems['mindar-image-system'];
                    if (!arSystem) {
                        alert('Ошибка: MindAR система еще не загрузилась. Попробуйте еще раз через секунду.');
                        startBtn.disabled = false;
                        startBtn.textContent = 'Старт AR';
                        return;
                    }

                    try {
                        await arSystem.start();
                        overlay.classList.add('hidden');
                        if (badge) badge.style.display = 'block';
                    } catch (err) {
                        console.error('Ошибка при запуске камеры/AR:', err);
                        alert('Не удалось запустить камеру:\n' + (err.message || err) + '\n\nУбедитесь, что вы предоставили доступ к камере.');
                        startBtn.disabled = false;
                        startBtn.textContent = 'Старт AR';
                    }
                };

                if (sceneEl.systems && sceneEl.systems['mindar-image-system']) {
                    await runAR();
                } else if (sceneEl.hasLoaded) {
                    await runAR();
                } else {
                    sceneEl.addEventListener('loaded', runAR, { once: true });
                }
            });
        });
    </script>
</body>
</html>
